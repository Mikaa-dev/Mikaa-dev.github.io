<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1018" />
    <meta name="description" content="Page not found — Kazim's developer portfolio." />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Page Not Found | Kazim</title>
    <style>
      .not-found { display: grid; min-height: 100svh; place-items: center; padding: 2rem 0; text-align: center; }
      .not-found__content { display: flex; flex-direction: column; align-items: center; }
      .not-found__code { margin: 0 0 1.5rem; color: var(--blue); font-family: var(--font-mono); font-size: clamp(5rem, 16vw, 10rem); font-weight: 500; letter-spacing: -0.1em; line-height: 0.8; }
      .not-found h1 { margin-bottom: 1rem; font-family: var(--font-sans); font-size: clamp(2.25rem, 5vw, 4rem); font-weight: 600; letter-spacing: -0.07em; line-height: .95; }
      .not-found p { max-width: 27rem; margin-bottom: 2rem; color: var(--ink-muted); }
    </style>
  </head>
  <body>
    <main class="not-found" id="main-content">
      <div class="container not-found__content">
        <a class="wordmark" href="index.html" aria-label="Kazim portfolio home"><span aria-hidden="true">&lt;</span>Kazim<span aria-hidden="true"> /&gt;</span></a>
        <p class="not-found__code" aria-hidden="true">404</p>
        <p class="eyebrow">Route unavailable</p>
        <h1>Page Not Found</h1>
        <p>The page you’re looking for doesn’t exist or may have moved.</p>
        <a class="button button-primary" href="index.html">Back to Portfolio <span aria-hidden="true">↖</span></a>
      </div>
    </main>
  </body>
</html>
